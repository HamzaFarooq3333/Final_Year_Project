name: ci-push

on:
  push:
    branches: ["**"]

concurrency:
  group: ci-push-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  push-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy src/cim

      - name: Import smoke
        run: uv run pytest tests/common/test_imports.py

      - name: Gitleaks
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --verbose --redact

      - name: Unit tests + coverage
        run: >
          uv run pytest -m "not sys and not lab"
          --cov=cim --cov-report=term-missing
          --cov-fail-under=60

      - name: Scripts --help smoke
        run: |
          set -euo pipefail
          for f in scripts/*; do
            case "$f" in
              *.sh) bash "$f" --help >/dev/null ;;
              *.py) uv run python "$f" --help >/dev/null ;;
              *) echo "skip $f" ;;
            esac
            echo "OK help: $f"
          done

      - name: check-env --ci
        run: |
          chmod +x scripts/check-env.sh
          uv run bash scripts/check-env.sh --ci
